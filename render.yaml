# Render 一键部署（render.com · 0 成本 free 层）
# 使用方法：
# 1. 推到 GitHub（已完成）
# 2. render.com 控制台 → New + → Blueprint → 选 Liao-wenxuan/agri-sense
# 3. Render 自动识别本文件并部署

services:
  - type: web
    name: agri-sense
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: DB_PATH
        value: /tmp/agri.db
      - key: SIMULATOR
        value: "true"
      - key: SIMULATOR_INTERVAL
        value: "5000"
      - key: JWT_SECRET
        value: agri-sense-2026-render-deploy-secret-change-in-production
