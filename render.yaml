# Render 一键部署（0 成本 free · 原生 Node runtime）
# 不用 Docker！Render 自动用 prebuilt native modules

services:
  - type: web
    name: agri-sense
    runtime: node
    plan: free
    region: oregon
    buildCommand: "cd web && npm install --legacy-peer-deps --no-audit --no-fund && npm run build && cd ../server && npm install --legacy-peer-deps --no-audit --no-fund && npm run build"
    startCommand: "cp -r web/dist server/dist/public && cd server && node dist/index.js"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DB_PATH
        value: /tmp/agri.db
      - key: SIMULATOR
        value: "true"
      - key: SIMULATOR_INTERVAL
        value: "5000"
      - key: JWT_SECRET
        value: agri-sense-2026-render-deploy-secret