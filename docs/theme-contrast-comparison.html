<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AgriSense · Element Plus 出厂色板 vs 加固方案对比</title>
<style>
  :root {
    --ink-1: #0f172a; --ink-2: #334155; --ink-3: #475569; --ink-4: #64748b;
    --line: #e2e8f0; --line-2: #cbd5e1;
    --page: #f6f7f9; --card: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 28px 24px 60px;
    background: var(--page); color: var(--ink-1);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .lede { color: var(--ink-3); margin: 0 0 22px; max-width: 900px; }
  .lede code { background: #e9edf3; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .col { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .col > h2 { margin: 0; padding: 12px 16px; font-size: 15px; border-bottom: 1px solid var(--line); }
  .col > h2 small { display: block; font-weight: 400; color: var(--ink-4); font-size: 12px; margin-top: 2px; }
  .pane { padding: 14px 16px; }
  .pane + .pane { border-top: 1px solid var(--line); }
  .pane > h3 { margin: 0 0 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-4); }
  .pane.dark { background: #0d1117; }
  .pane.dark > h3 { color: #8b949e; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }

  .tag { display: inline-flex; align-items: center; height: 24px; padding: 0 9px; font-size: 12px; border-radius: 4px; border: 1px solid transparent; }
  .btn { display: inline-flex; align-items: center; height: 32px; padding: 0 15px; font-size: 14px; border-radius: 4px; border: 1px solid transparent; }
  .ph { display: inline-flex; align-items: center; height: 32px; padding: 0 12px; font-size: 14px; border-radius: 4px; border: 1px solid; background: transparent; }
  .item { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
  .ratio { font-size: 11px; font-family: Consolas, ui-monospace, monospace; padding: 0 4px; border-radius: 3px; line-height: 16px; }
  .pass { color: #15803d; background: #dcfce7; }
  .fail { color: #b91c1c; background: #fee2e2; }
  .pane.dark .pass { color: #86efac; background: #14532d; }
  .pane.dark .fail { color: #fca5a5; background: #7f1d1d; }

  table { width: 100%; border-collapse: collapse; margin-top: 22px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; }
  th { background: #f1f5f9; font-weight: 600; }
  td.n { font-family: Consolas, ui-monospace, monospace; }
  tr:last-child td { border-bottom: none; }
  .note { margin-top: 26px; color: var(--ink-3); max-width: 900px; }
  .note li { margin-bottom: 6px; }
</style>
</head>
<body>
<h1>Element Plus 出厂色板 vs 加固方案</h1>
<p class="lede">
  只针对 <code>el-tag</code> / <code>el-button</code> / 输入框占位符三类 Element Plus 组件，
  <b>不触碰项目自有绿色品牌色</b>。每个色块下方是页面实时用 <code>getComputedStyle</code>
  取到的前景/背景色算出的 WCAG 对比度，阈值 4.5:1（正文级）。
</p>

<div class="cols" id="cols"></div>

<table id="tbl"></table>

<ul class="note" id="note"></ul>

<script>
const EP_LIGHT = {
  tags: [['primary', '#409eff', '#ecf5ff'], ['info', '#909399', '#f4f4f5'],
         ['success', '#67c23a', '#f0f9eb'], ['warning', '#e6a23c', '#fdf6ec'],
         ['danger', '#f56c6c', '#fef0f0']],
  buttons: [['primary', '#ffffff', '#409eff'], ['success', '#ffffff', '#67c23a'],
            ['warning', '#ffffff', '#e6a23c'], ['danger', '#ffffff', '#f56c6c']],
  placeholder: ['#a8abb2', '#ffffff']
};
const EP_DARK = {
  tags: [['primary', '#409eff', '#18222b'], ['info', '#909399', '#202121'],
         ['success', '#67c23a', '#1c2518'], ['warning', '#e6a23c', '#292218'],
         ['danger', '#f56c6c', '#2a1d1d']],
  buttons: [['primary', '#ffffff', '#409eff'], ['success', '#ffffff', '#67c23a'],
            ['warning', '#ffffff', '#e6a23c'], ['danger', '#ffffff', '#f56c6c']],
  placeholder: ['#8d9095', '#141414']
};

const A_LIGHT = {
  tags: [['primary', '#1e40af', '#ecf5ff'], ['info', '#4b5563', '#f4f4f5'],
         ['success', '#166534', '#f0f9eb'], ['warning', '#b45309', '#fdf6ec'],
         ['danger', '#b91c1c', '#fef0f0']],
  buttons: [['primary', '#ffffff', '#3375b9'], ['success', '#ffffff', '#3a7d1e'],
            ['warning', '#ffffff', '#b45309'], ['danger', '#ffffff', '#b91c1c']],
  placeholder: ['#6b7280', '#ffffff']
};
const A_DARK = {
  tags: EP_DARK.tags,
  buttons: [['primary', '#ffffff', '#3375b9'], ['success', '#ffffff', '#3a7d1e'],
            ['warning', '#ffffff', '#b45309'], ['danger', '#ffffff', '#b91c1c']],
  placeholder: ['#8d9095', '#141414']
};
const B_LIGHT = {
  tags: A_LIGHT.tags,
  buttons: [['primary', '#0d1117', '#409eff'], ['success', '#0d1117', '#67c23a'],
            ['warning', '#0d1117', '#e6a23c'], ['danger', '#0d1117', '#f56c6c']],
  placeholder: ['#6b7280', '#ffffff']
};
const B_DARK = {
  tags: EP_DARK.tags,
  buttons: [['primary', '#0d1117', '#409eff'], ['success', '#0d1117', '#67c23a'],
            ['warning', '#0d1117', '#e6a23c'], ['danger', '#0d1117', '#f56c6c']],
  placeholder: ['#8d9095', '#141414']
};

const VARIANTS = [
  { key: 'cur', label: '现状', sub: 'Element Plus 2.8 出厂值，两套主题通用', light: EP_LIGHT, dark: EP_DARK },
  { key: 'a', label: '方案 A', sub: '标签换同色系深字；按钮改深底白字', light: A_LIGHT, dark: A_DARK },
  { key: 'b', label: '方案 B', sub: '标签同 A；按钮保留鲜艳底色，文字改近黑', light: B_LIGHT, dark: B_DARK },
  { key: 'c', label: '方案 C', sub: '按主题择优：浅色用 A，暗色用 B', light: A_LIGHT, dark: B_DARK }
];

function parseColor(s) {
  const m = String(s).match(/rgba?\(([^)]+)\)/);
  if (!m) return null;
  const p = m[1].split(',').map(x => parseFloat(x));
  return { r: p[0], g: p[1], b: p[2], a: p.length > 3 ? p[3] : 1 };
}
function lum(c) {
  const f = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(c.r) + 0.7152 * f(c.g) + 0.0722 * f(c.b);
}
function ratio(a, b) {
  const la = lum(a), lb = lum(b);
  const hi = Math.max(la, lb), lo = Math.min(la, lb);
  return (hi + 0.05) / (lo + 0.05);
}
function rgb(c) { return 'rgb(' + Math.round(c.r) + ',' + Math.round(c.g) + ',' + Math.round(c.b) + ')'; }
function hex(c) {
  const h = v => Math.round(v).toString(16).padStart(2, '0');
  return '#' + h(c.r) + h(c.g) + h(c.b);
}
function alpha(hexStr, a) {
  const c = parseColor('rgb(' + hexStr.slice(1) + ')');
  return 'rgba(' + Math.round(c.r) + ',' + Math.round(c.g) + ',' + Math.round(c.b) + ',' + a + ')';
}

const MIN = 4.5;
const LABEL = { primary: 'primary', info: 'info', success: 'success', warning: 'warning', danger: 'danger' };

function sample(kind, name, fg, bg) {
  const el = kind === 'tag'
    ? document.createElement('span')
    : document.createElement('span');
  el.className = kind === 'tag' ? 'tag' : (kind === 'button' ? 'btn' : 'ph');
  el.textContent = kind === 'button' ? LABEL[name] : (kind === 'ph' ? '占位符文字' : LABEL[name]);
  el.style.color = fg;
  el.style.background = bg;
  el.style.borderColor = kind === 'tag' ? alpha(fg, 0.35) : (kind === 'button' ? bg : alpha(fg, 0.5));
  const wrap = document.createElement('div');
  wrap.className = 'item';
  wrap.appendChild(el);
  const badge = document.createElement('span');
  badge.className = 'ratio';
  wrap.appendChild(badge);
  return { wrap, badge, fg, bg };
}

function buildPane(themeName, data, dark) {
  const pane = document.createElement('div');
  pane.className = 'pane' + (dark ? ' dark' : '');
  const h = document.createElement('h3');
  h.textContent = themeName;
  pane.appendChild(h);

  const r1 = document.createElement('div'); r1.className = 'row';
  const r2 = document.createElement('div'); r2.className = 'row';
  const r3 = document.createElement('div'); r3.className = 'row';

  data.tags.forEach(t => { const s = sample('tag', t[0], t[1], t[2]); r1.appendChild(s.wrap); s.kind = 'tag'; s.name = t[0]; });
  data.buttons.forEach(b => { const s = sample('button', b[0], b[1], b[2]); r2.appendChild(s.wrap); s.kind = 'button'; s.name = b[0]; });
  const s = sample('ph', 'placeholder', data.placeholder[0], data.placeholder[1]);
  r3.appendChild(s.wrap); s.kind = 'ph'; s.name = 'placeholder';

  pane.appendChild(r1); pane.appendChild(r2); pane.appendChild(r3);
  return { pane, samples: pane.querySelectorAll('.item') };
}

const cols = document.getElementById('cols');
const rows = [];
VARIANTS.forEach(v => {
  const col = document.createElement('div');
  col.className = 'col';
  const h2 = document.createElement('h2');
  h2.innerHTML = v.label + '<small>' + v.sub + '</small>';
  col.appendChild(h2);
  const L = buildPane('浅色主题', v.light, false);
  const D = buildPane('暗色主题', v.dark, true);
  col.appendChild(L.pane); col.appendChild(D.pane);
  cols.appendChild(col);

  [[v.key, 'light', v.light], [v.key, 'dark', v.dark]].forEach(([key, tn, data]) => {
    data.tags.forEach(t => rows.push({ v: key, t: tn, kind: 'tag', name: t[0], fg: t[1], bg: t[2] }));
    data.buttons.forEach(b => rows.push({ v: key, t: tn, kind: 'button', name: b[0], fg: b[1], bg: b[2] }));
    rows.push({ v: key, t: tn, kind: 'ph', name: 'placeholder', fg: data.placeholder[0], bg: data.placeholder[1] });
  });
});

requestAnimationFrame(() => {
  const badges = document.querySelectorAll('.ratio');
  const byKey = {};
  let i = 0;
  VARIANTS.forEach(v => {
    ['light', 'dark'].forEach(tn => {
      const data = v[tn];
      const list = [];
      data.tags.forEach(t => list.push({ kind: 'tag', name: t[0], fg: t[1], bg: t[2] }));
      data.buttons.forEach(b => list.push({ kind: 'button', name: b[0], fg: b[1], bg: b[2] }));
      list.push({ kind: 'ph', name: 'placeholder', fg: data.placeholder[0], bg: data.placeholder[1] });
      byKey[v.key + '_' + tn] = list;
    });
  });

  document.querySelectorAll('.pane').forEach(pane => {
    const items = pane.querySelectorAll('.item');
    const paneTitle = pane.querySelector('h3').textContent;
    const tn = paneTitle.indexOf('暗') >= 0 ? 'dark' : 'light';
    const col = pane.closest('.col');
    const idx = Array.from(cols.children).indexOf(col);
    const v = VARIANTS[idx];
    const list = byKey[v.key + '_' + tn];
    items.forEach((it, k) => {
      const spec = list[k];
      const badge = it.querySelector('.ratio');
      const fg = parseColor(getComputedStyle(it.querySelector('.tag,.btn,.ph')).color);
      const bg = parseColor(getComputedStyle(it.querySelector('.tag,.btn,.ph')).backgroundColor);
      const r = ratio(fg, bg);
      const ok = r >= MIN;
      badge.textContent = r.toFixed(2) + ':1' + (ok ? ' ✓' : ' ✗');
      badge.className = 'ratio ' + (ok ? 'pass' : 'fail');
      spec.ratio = r;
      spec.ok = ok;
    });
  });

  const tbl = document.getElementById('tbl');
  const kinds = [['tag', '标签'], ['button', '按钮'], ['ph', '占位符']];
  const parseHex = h => {
  const s = String(h).replace('#', '');
  const v = i => parseInt(s.substr(i, 2), 16);
  return { r: v(0), g: v(2), b: v(4), a: 1 };
};
const ratioHex = (fg, bg) => ratio(parseHex(fg), parseHex(bg));
  let html = '<thead><tr><th>组件</th><th>类型</th>' +
    VARIANTS.map(v => '<th>' + v.label + ' · 浅色</th><th>' + v.label + ' · 暗色</th>').join('') +
    '</tr></thead><tbody>';
  ['primary', 'info', 'success', 'warning', 'danger', 'placeholder'].forEach(name => {
    kinds.forEach(kk => {
      const rowsFor = rows.filter(r => r.kind === kk[0] && r.name === name);
      if (!rowsFor.length) return;
      const cells = VARIANTS.flatMap(v => ['light', 'dark'].map(tn => {
        const r = rowsFor.find(x => x.v === v.key && x.t === tn);
        if (!r) return '<td class="n">—</td>';
        const val = ratioHex(r.fg, r.bg);
        const ok = val >= MIN;
        return '<td class="n"><span class="ratio ' + (ok ? 'pass' : 'fail') + '">' + val.toFixed(2) + ':1' + (ok ? ' ✓' : ' ✗') + '</span></td>';
      }));
      html += '<tr><td>' + kk[1] + '</td><td>' + name + '</td>' + cells.join('') + '</tr>';
    });
  });
  html += '</tbody>';
  tbl.innerHTML = html;

  const note = document.getElementById('note');
  note.innerHTML = [
    '<b>怎么读这张表</b>：✓ = ≥ 4.5:1（WCAG AA 正文级），✗ = 不达标。数字由页面实时读取渲染后的前景/背景色计算。',
    '<b>现状</b>：Element Plus 2.8 出厂值。浅色主题下标签 2.04~2.80、彩色按钮白字 2.19~2.90、占位符 2.30 —— 暗色主题的标签本来就没问题（5.24~7.18），只有彩色按钮同样是白字。',
    '<b>方案 A</b>：浅色主题标签换成同色系深色字（蓝 800 / 绿 800 / 灰 600 / 琥珀 700 / 红 700），彩色按钮底色改深一档、白字不变。观感：标签更沉、按钮饱和度下降。',
    '<b>方案 B</b>：标签同 A；彩色按钮保留 EP 的鲜艳底色，文字从白改成近黑（#0d1117）。观感：颜色最跳，但「深色字 + 亮蓝/亮绿按钮」是反直觉的，评委第一眼可能觉得怪。',
    '<b>方案 C</b>：按主题各取最优 —— 浅色主题底色浅，用 A 的「深底白字」；暗色主题底色深，用 B 的「鲜艳底近黑字」，亮色按钮在深底上更跳也更好读。',
    '<b>两种方案都不改</b>：Element Plus 出厂绿/蓝/琥珀/红本身就是这样，任何用 EP 的项目都是这个观感；改色属于设计决策而非缺陷修复。'
  ].map(s => '<li>' + s + '</li>').join('');
});
</script>
</body>
</html>
